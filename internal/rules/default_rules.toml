# Built-in rules for shh. Override them in ~/.config/shh/rules.toml:
#   - a rule with the same name replaces the default,
#   - a new name adds a rule,
#   - `enabled = false` on a name removes a default.
# Every pattern is a Go regular expression (RE2) and is matched case-insensitively.

# Urgency words. A match adds `boost` to the score; the total boost is capped at 0.4 (plan.md section 5.4).
[[urgency]]
name = "outage"
pattern = '\b(outage|incident|sev ?[01]|p[01])\b'
boost = 0.3

[[urgency]]
name = "urgent"
pattern = '\b(urgent|asap|emergency|immediately)\b'
boost = 0.3

[[urgency]]
name = "prod"
pattern = '\b(prod|production)\b'
boost = 0.2

[[urgency]]
name = "down"
pattern = '\b(down|broken|failing|failed)\b'
boost = 0.2

[[urgency]]
name = "now"
pattern = '\bnow\b'
boost = 0.1

[[urgency]]
name = "deadline"
pattern = '\b(deadline|due (today|tonight))\b'
boost = 0.1

# People and apps that always matter. Matched case-insensitively against the whole sender or source name.
[vip]
senders = []
apps = []

# How much each app tends to matter, 0 to 1. Starting values for the classifier, not decisions.
[app_priority]
Teams = 0.6
Slack = 0.6
Messages = 0.7
Outlook = 0.5
Mail = 0.4

# Notification categories that mean "calendar reminder". Outlook names its reminder categories OLAlertsNotificationReminders...
[[calendar.category]]
name = "outlook-reminder"
pattern = '^OLAlertsNotificationReminders'

# How a reminder states the start time. The calendar parser tries these in order and reads the named groups
# year, month, day, hour, minute, ampm and minutes.
[[calendar.date]]
name = "month-day-year-at-time"
pattern = '(?P<month>[a-z]+) (?P<day>\d{1,2}), (?P<year>\d{4}) at (?P<hour>\d{1,2}):(?P<minute>\d{2})(?: ?(?P<ampm>am|pm))?'

[[calendar.date]]
name = "today-at-time"
pattern = '\btoday at (?P<hour>\d{1,2}):(?P<minute>\d{2})(?: ?(?P<ampm>am|pm))?'

[[calendar.date]]
name = "in-minutes"
pattern = '\bin (?P<minutes>\d+) ?(?:min|minutes?)\b'

[[calendar.date]]
name = "all-day"
pattern = '\ball[- ]day\b'
