version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list
    silent: true

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  build:
    desc: Build ./shh
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o shh ./cmd/shh

  check:
    desc: Format check, vet and test (run before every commit)
    cmds:
      - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - task: vet
      - task: test

  capture:
    desc: Log meeting-style notifications to captures/meetings.jsonl (gitignored; Ctrl-C to stop)
    cmds:
      - python3 tools/capture.py {{.CLI_ARGS}}

  capture:once:
    desc: Capture new meeting-style notifications once and exit
    cmds:
      - python3 tools/capture.py --once

  spike:suppress:
    desc: "Spike 02: run the banner suppressor for 45 s (hides banners except titles starting with [shh])"
    cmds:
      - osascript -l JavaScript spikes/focus-ax/ax_filter.js

  spike:banner:
    desc: 'Spike 03: show a sample overlay banner (OVERLAY_JSON env overrides style, e.g. OVERLAY_JSON=''{"color":"#0a84ff"}'')'
    cmds:
      - osascript -l JavaScript spikes/banner/overlay.js

  spike:menubar:jxa:
    desc: "Spike 04: run the JXA status item prototype (SPIKE_SECONDS sets the countdown, default 120)"
    cmds:
      - osascript -l JavaScript spikes/menubar/statusitem.js

  spike:menubar:
    desc: "Spike 04: run the menu bar tray prototype (needs CGo; click 'Quit spike' in its menu to stop)"
    dir: spikes/menubar
    env:
      CGO_ENABLED: "1"
    cmds:
      - go run .
