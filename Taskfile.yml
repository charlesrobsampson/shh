version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list
    silent: true

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  build:
    desc: Build ./shh
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o shh ./cmd/shh

  check:
    desc: Format check, vet and test (run before every commit)
    cmds:
      - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - task: vet
      - task: test

  capture:
    desc: Log meeting-style notifications to captures/meetings.jsonl (gitignored; Ctrl-C to stop)
    cmds:
      - python3 tools/capture.py {{.CLI_ARGS}}

  capture:once:
    desc: Capture new meeting-style notifications once and exit
    cmds:
      - python3 tools/capture.py --once

  spike:focus:on:
    desc: "Spike 02: run the shh-focus-on Shortcut and print its latency"
    cmds:
      - /usr/bin/time -p shortcuts run shh-focus-on

  spike:focus:off:
    desc: "Spike 02: run the shh-focus-off Shortcut and print its latency"
    cmds:
      - /usr/bin/time -p shortcuts run shh-focus-off

  spike:focus:notify:
    desc: "Spike 02: post a test notification, then show the newest rows in the notification DB (read-only)"
    vars:
      DB: $HOME/Library/Group Containers/group.com.apple.usernoted/db2/db
    cmds:
      - osascript -e 'display notification "shh spike test" with title "shh spike"'
      - sleep 2
      - sqlite3 -readonly "{{.DB}}" "select r.rec_id, a.identifier, datetime(r.delivered_date + 978307200, 'unixepoch', 'localtime') from record r join app a using(app_id) order by r.rec_id desc limit 5"
