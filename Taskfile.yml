version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list
    silent: true

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  build:
    desc: Build ./shh
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o shh ./cmd/shh

  build:release:
    desc: "Build the lightweight release, dist/shh, without the embedding model (shh model install adds it)"
    cmds:
      - mkdir -p dist
      - go build -ldflags "-X main.version={{.VERSION}}" -o dist/shh ./cmd/shh
      - ls -l dist/shh

  build:release:full:
    desc: "Build dist/shh-full with the embedding model inside (-tags embedmodel), after checking the model is the one the source expects"
    deps: [model:verify]
    cmds:
      - mkdir -p internal/classify/assets dist
      - cp private/models/potion-base-8M-int8.bin internal/classify/assets/potion-base-8M-int8.bin
      - go build -tags embedmodel -ldflags "-X main.version={{.VERSION}}" -o dist/shh-full ./cmd/shh
      - ls -l dist/shh-full
      - dist/shh-full doctor | grep "embedding model"

  check:
    desc: Format check, vet and test (run before every commit)
    cmds:
      - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - task: vet
      - task: test

  capture:
    desc: Log meeting-style notifications to captures/meetings.jsonl (gitignored; Ctrl-C to stop)
    cmds:
      - python3 tools/capture.py {{.CLI_ARGS}}

  capture:once:
    desc: Capture new meeting-style notifications once and exit
    cmds:
      - python3 tools/capture.py --once

  e2e:routines:
    desc: Run a routine through the real binary and a real worker in a throwaway HOME (takes about 20 s; nothing on screen is touched)
    cmds:
      - tools/e2e_routines.sh

  e2e:schedule:
    desc: Let a trigger start a routine by itself through the real binary and a real worker in a throwaway HOME (takes up to 2.5 minutes; nothing on screen is touched)
    cmds:
      - tools/e2e_schedule.sh

  banner:layout:
    desc: Lay real banners out headlessly (the banner script with the window never shown) and check the buttons fit; macOS only, nothing appears on the screen
    cmds:
      - python3 tools/banner_layout/check.py

  watch:invites:
    desc: Watch for meeting invites and record only their structure to private/captures/invites.jsonl; says ENOUGH after 5 (task 47)
    cmds:
      - python3 tools/watch_invites.py {{.CLI_ARGS}}

  spike:suppress:
    desc: "Spike 02: run the banner suppressor for 45 s (hides banners except titles starting with [shh])"
    cmds:
      - osascript -l JavaScript spikes/focus-ax/ax_filter.js

  spike:banner:
    desc: 'Spike 03: show a sample overlay banner (OVERLAY_JSON env overrides style, e.g. OVERLAY_JSON=''{"color":"#0a84ff"}'')'
    cmds:
      - osascript -l JavaScript spikes/banner/overlay.js

  spike:menubar:jxa:
    desc: "Spike 04: run the JXA status item prototype (SPIKE_SECONDS sets the countdown, default 120)"
    cmds:
      - osascript -l JavaScript spikes/menubar/statusitem.js

  spike:menubar:
    desc: "Spike 04: run the menu bar tray prototype (needs CGo; click 'Quit spike' in its menu to stop)"
    dir: spikes/menubar
    env:
      CGO_ENABLED: "1"
    cmds:
      - go run .

  spike:embeddings:
    desc: "Spike 05: compare the candidate models (run model:fetch first)"
    dir: spikes/embeddings
    cmds:
      - go run . ../../private/models

  model:fetch:
    desc: "Download the Model2Vec models (spike 05 candidates) into private/models (gitignored)"
    cmds:
      - for: [potion-base-2M, potion-base-4M, potion-base-8M]
        cmd: |
          mkdir -p private/models/{{.ITEM}}
          for f in config.json tokenizer.json model.safetensors README.md; do
            curl -sSL --fail -o private/models/{{.ITEM}}/$f https://huggingface.co/minishlab/{{.ITEM}}/resolve/main/$f
          done

  model:verify:
    desc: "Check that private/models/potion-base-8M-int8.bin exists and has the sha256 the source pins (classify.DefaultModelSHA256); builds it if it is missing"
    cmds:
      - test -f private/models/potion-base-8M-int8.bin || task model:build
      - |
        want=$(grep -o 'DefaultModelSHA256 = "[0-9a-f]*"' internal/classify/static.go | grep -o '[0-9a-f]\{64\}')
        got=$(shasum -a 256 private/models/potion-base-8M-int8.bin | cut -d' ' -f1)
        if [ "$want" != "$got" ]; then echo "model sha256 is $got, the source pins $want" >&2; exit 1; fi
        echo "model ok: $got"

  model:publish:
    desc: "Publish the model asset as the models-v1 GitHub release (what shh init downloads for a build without the model inside)"
    deps: [model:verify]
    cmds:
      - gh release create models-v1 private/models/potion-base-8M-int8.bin --title "Embedding model v1" --notes "potion-base-8M quantized to int8, built by task model:build. sha256 is pinned in internal/classify/static.go."

  model:build:
    desc: "Build the quantized embedding model asset, private/models/potion-base-8M-int8.bin, and print its sha256"
    deps: [model:fetch]
    cmds:
      - go run ./tools/modelbuild private/models/potion-base-8M private/models/potion-base-8M-int8.bin potion-base-8M-int8
