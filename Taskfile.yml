version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list
    silent: true

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  build:
    desc: Build ./shh
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o shh ./cmd/shh

  check:
    desc: Format check, vet and test (run before every commit)
    cmds:
      - test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - task: vet
      - task: test

  capture:
    desc: Log meeting-style notifications to captures/meetings.jsonl (gitignored; Ctrl-C to stop)
    cmds:
      - python3 tools/capture.py {{.CLI_ARGS}}

  capture:once:
    desc: Capture new meeting-style notifications once and exit
    cmds:
      - python3 tools/capture.py --once

  e2e:routines:
    desc: Run a routine through the real binary and a real worker in a throwaway HOME (takes about 20 s; nothing on screen is touched)
    cmds:
      - tools/e2e_routines.sh

  watch:invites:
    desc: Watch for meeting invites and record only their structure to private/captures/invites.jsonl; says ENOUGH after 5 (task 47)
    cmds:
      - python3 tools/watch_invites.py {{.CLI_ARGS}}

  spike:suppress:
    desc: "Spike 02: run the banner suppressor for 45 s (hides banners except titles starting with [shh])"
    cmds:
      - osascript -l JavaScript spikes/focus-ax/ax_filter.js

  spike:banner:
    desc: 'Spike 03: show a sample overlay banner (OVERLAY_JSON env overrides style, e.g. OVERLAY_JSON=''{"color":"#0a84ff"}'')'
    cmds:
      - osascript -l JavaScript spikes/banner/overlay.js

  spike:menubar:jxa:
    desc: "Spike 04: run the JXA status item prototype (SPIKE_SECONDS sets the countdown, default 120)"
    cmds:
      - osascript -l JavaScript spikes/menubar/statusitem.js

  spike:menubar:
    desc: "Spike 04: run the menu bar tray prototype (needs CGo; click 'Quit spike' in its menu to stop)"
    dir: spikes/menubar
    env:
      CGO_ENABLED: "1"
    cmds:
      - go run .

  spike:embeddings:
    desc: "Spike 05: compare the candidate models (run model:fetch first)"
    dir: spikes/embeddings
    cmds:
      - go run . ../../private/models

  model:fetch:
    desc: "Download the Model2Vec models (spike 05 candidates) into private/models (gitignored)"
    cmds:
      - for: [potion-base-2M, potion-base-4M, potion-base-8M]
        cmd: |
          mkdir -p private/models/{{.ITEM}}
          for f in config.json tokenizer.json model.safetensors README.md; do
            curl -sSL --fail -o private/models/{{.ITEM}}/$f https://huggingface.co/minishlab/{{.ITEM}}/resolve/main/$f
          done

  model:build:
    desc: "Build the quantized embedding model asset, private/models/potion-base-8M-int8.bin, and print its sha256"
    deps: [model:fetch]
    cmds:
      - go run ./tools/modelbuild private/models/potion-base-8M private/models/potion-base-8M-int8.bin potion-base-8M-int8
